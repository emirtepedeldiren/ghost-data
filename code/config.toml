# Runtime configuration. Provider and model IDs live here, never in pipeline logic (D10 revised).
# API keys are NOT configured here: GEMINI_API_KEY / ANTHROPIC_API_KEY come from the environment or the
# uncommitted repo-root .env.

[llm]
provider = "gemini"              # "gemini" | "anthropic"
cache_dir = "code/llm_cache"     # cached responses, keyed by provider+model+task+inputs (tracked: the frozen run reads only these)
usage_log = ".work/llm_calls.jsonl"   # per-call log incl. cache hits (dev only); original API calls: code/llm_cache/calls.jsonl

[llm.models]
# D17 approved gemini-3.8-flash for intent, but on 2026-10-24 it timed out on every request (also via the
# gemini-flash-latest alias), and gemini-3.6-flash hit the free-tier quota (20 requests/day/model) after 16 calls.
# D18: gemini-2.5-flash, batched (80 texts per call).
intent = "gemini-2.5-flash"
# Set after the D17 screenshot comparison (gemini-3.5-flash-lite vs gemini-2.5-flash).
vision = "gemini-3.5-flash-lite"

# List prices in USD per 1M tokens, used for usage_report.md cost estimates even on the free tier.
[llm.prices."gemini-3.8-flash"]
input = 0.75
output = 3.75
source = "https://ai.google.dev/gemini-api/docs/pricing (page updated 2026-10-22; price valid through 2026-12-31, $1.50/$7.50 from 2027-01-01)"

[llm.prices."gemini-3.6-flash"]
input = 0.75
output = 3.75
source = "https://ai.google.dev/gemini-api/docs/pricing (page updated 2026-10-22; price valid through 2026-12-31, $1.50/$7.50 from 2027-01-01)"

[llm.prices."gemini-3.5-flash-lite"]
input = 0.30
output = 2.50
source = "https://ai.google.dev/gemini-api/docs/pricing (page updated 2026-10-22)"

[llm.prices."gemini-2.5-flash"]
input = 0.30
output = 2.50
source = "https://ai.google.dev/gemini-api/docs/pricing (page updated 2026-10-22; text/image/video input)"
